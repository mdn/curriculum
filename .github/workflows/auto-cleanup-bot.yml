name: Create curriculum auto-fix PR

on:
  push:
    branches:
      - auto-cleanup-bot
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# No GITHUB_TOKEN permissions, as we only use it to increase API limit.
# We use AUTOMERGE_TOKEN to create the PR.
permissions: {}

jobs:
  fix:
    if: github.repository_owner == 'mdn'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mdn/content
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: mdn/content
          path: mdn/content
          persist-credentials: false

      - name: Checkout mdn/curriculum
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: mdn/curriculum
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: mdn/content/.nvmrc
          cache: npm
          cache-dependency-path: |
            mdn/content/package-lock.json
            mdn/curriculum/package-lock.json

      - name: Install mdn/content
        run: npm ci
        working-directory: mdn/content

      - name: Install mdn/curriculum
        run: npm ci
        working-directory: mdn/curriculum
        env:
          LEFTHOOK: 0

      - name: Apply fixes
        working-directory: mdn/content
        env:
          CONTENT_ROOT: ${{ github.workspace }}/mdn/content/files
          CURRICULUM_ROOT: ${{ github.workspace }}/mdn/curriculum
          # Used by the `rari` cli to avoid rate limiting issues
          # when fetching the latest releases info from the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}
        run: npx @mdn/rari content fix-flaws --curriculum

      - name: Format
        run: npm run fix
        working-directory: mdn/curriculum

      - name: Create PR with only fixable issues
        if: success()
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: mdn/curriculum
          commit-message: "chore: auto-fix flaws"
          branch: fix-flaws-auto-cleanup
          title: "fix: auto-cleanup by bot"
          author: mdn-bot <108879845+mdn-bot@users.noreply.github.com>
          committer: mdn-bot <108879845+mdn-bot@users.noreply.github.com>
          body: |
            This PR was generated by [this run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) of the [`auto-cleanup-bot`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/auto-cleanup-bot.yml) workflow.

            All issues were auto-fixed.
          labels: |
            automated pr
          token: ${{ secrets.AUTOMERGE_TOKEN }}

      - name: Create PR with notice on unfixed issues
        if: failure()
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: mdn/curriculum
          commit-message: "chore: auto-fix flaws"
          branch: fix-flaws-auto-cleanup
          title: "fix: auto-cleanup by bot"
          author: mdn-bot <108879845+mdn-bot@users.noreply.github.com>
          committer: mdn-bot <108879845+mdn-bot@users.noreply.github.com>
          body: |
            This PR was generated by the [`auto-cleanup-bot`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/auto-cleanup-bot.yml) workflow.

            Auto-fix was run, but additional issues found.
            Please review the [run log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          labels: |
            automated pr
          token: ${{ secrets.AUTOMERGE_TOKEN }}
